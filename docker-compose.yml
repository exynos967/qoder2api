services:
  qoder2api:
    image: ${QODER2API_IMAGE:-ghcr.io/exynos967/qoder2api:edge}
    container_name: qoder2api
    restart: unless-stopped
    ports:
      - "28001:28001"
    environment:
      TZ: Asia/Shanghai
      QODER2API_HOST: 0.0.0.0
      QODER2API_PORT: 28001
      QODER2API_BROWSER_LOGIN_BACKEND: namespaced
      QODER2API_QODER_HOME: /data/.qoder
      QODER2API_WORKSPACE: /data
      QODER2API_NAMESPACED_LOGIN_SCRIPT: /opt/qoder-machine/qoder-machine/xieyi/qoder_pure_login.py
      QODER2API_NAMESPACED_LOGIN_OUTPUT_ROOT: /data/.qoder2api/xieyi
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
