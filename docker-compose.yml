services:
  qoder2api:
    build: .
    container_name: qoder2api
    restart: unless-stopped
    ports:
      - "28001:28001"
    environment:
      QODER2API_HOST: 0.0.0.0
      QODER2API_PORT: 28001
      QODER2API_QODER_HOME: /data/.qoder
      QODER2API_WORKSPACE: /workspace
    volumes:
      - ../.qoder:/data/.qoder
      - ..:/workspace
